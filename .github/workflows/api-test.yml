name: GoRest API Tests

on:
  push:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run Huỳnh Lê Minh Phú-2474802010308-GoRest.postman_collection.json \
            -e Huỳnh Lê Minh Phú-2474802010308-GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN"
